name: Release Trust Smoke Test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify without publishing assets
        required: true
        type: string
        default: v2.5.6

permissions:
  contents: read

jobs:
  smoke:
    name: Verify CNB tag mirror and release access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      # Exercises the exact command the publish job runs, so a malformed or
      # unknown tag fails here before any release job is dispatched.
      - name: Resolve release version metadata
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: go -C desktop run ./cmd/release-version -tag "${RELEASE_TAG}" -github-output "${GITHUB_OUTPUT}"

      - name: Verify GitHub tag is mirrored to CNB at the same commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local repository="$1"
            local direct
            local peeled
            direct="$(git ls-remote "${repository}" "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 {print $1}')"
            peeled="$(git ls-remote "${repository}" "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
            if [[ -n "${peeled}" ]]; then
              printf '%s' "${peeled}"
            else
              printf '%s' "${direct}"
            fi
          }
          github_commit="$(resolve_tag_commit https://github.com/Hypostasis-Cat/HypoMux.git)"
          cnb_commit="$(resolve_tag_commit https://cnb.cool/Hypostasis-Cat/HypoMux)"
          if [[ -z "${github_commit}" || -z "${cnb_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} is missing from GitHub or CNB."
            exit 1
          fi
          if [[ "${github_commit}" != "${cnb_commit}" ]]; then
            echo "Tag mirror mismatch for ${RELEASE_TAG}: GitHub ${github_commit}, CNB ${cnb_commit}."
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} is mirrored at ${github_commit}."

      - name: Verify CNB token can read the existing Release
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_IMAGE: docker.cnb.cool/looc/git-cnb@sha256:c254172bb9d6025733a0e2991b4a99af8c46aeedcadcb468788ef5a0dc00275c
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          credential_file="$(mktemp)"
          cleanup() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            rm -f "${credential_file}"
          }
          trap cleanup EXIT
          chmod 600 "${credential_file}"
          git config --local credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=cnb.cool\nusername=cnb\npassword=%s\n\n' "${CNB_TOKEN}" |
            git credential approve
          git ls-remote https://cnb.cool/Hypostasis-Cat/HypoMux refs/heads/main >/dev/null
          docker run --rm -e CNB_TOKEN "${CNB_IMAGE}" \
            git-cnb --repo=Hypostasis-Cat/HypoMux \
            release get -t "${RELEASE_TAG}" >/dev/null
          echo "CNB Release ${RELEASE_TAG} is readable; no assets were created or uploaded."
