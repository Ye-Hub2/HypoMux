name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Build/signing mode (publish requires selecting a v* tag)
        required: true
        type: choice
        options: [none, test, production, publish]
        default: none

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  WAILS_VERSION: v3.0.0-alpha2.119
  PNPM_VERSION: 10.34.5
  INSTALLER_PATH: desktop/bin/hypomux-amd64-installer.exe

jobs:
  build:
    name: Validate and package Wails desktop
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release options
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ inputs.signing_mode }}" -eq "production" -and
              "${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production-signing tests must be started from main."
          }
          if ("${{ inputs.signing_mode }}" -eq "publish" -and
              "${{ github.ref }}" -notlike "refs/tags/v*") {
            throw "Publishing must be started from a v* tag."
          }
          if ("${{ inputs.signing_mode }}" -eq "test" -and
              "${{ github.ref }}" -like "refs/tags/*") {
            throw "Test signing must not be started from a release tag."
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare and validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            go -C desktop run ./cmd/release-version -tag $env:GITHUB_REF_NAME -write -notes
          } else {
            go -C desktop run ./cmd/release-version -check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore pnpm tool cache
        id: pnpm-tool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hypomux-pnpm
          key: pnpm-tool-${{ runner.os }}-${{ runner.arch }}-${{ env.PNPM_VERSION }}-v1

      - name: Install pinned pnpm
        if: steps.pnpm-tool.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Install the requested version directly, without a v11 bootstrap/self-update.
          npm install --global --prefix "$env:RUNNER_TEMP/hypomux-pnpm" "pnpm@${env:PNPM_VERSION}" --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure pnpm
        id: pnpm
        shell: pwsh
        run: |
          $pnpmDirectory = Join-Path $env:RUNNER_TEMP 'hypomux-pnpm'
          $pnpmCommand = Join-Path $pnpmDirectory 'pnpm.cmd'
          $installedVersion = & $pnpmCommand --version
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne $env:PNPM_VERSION) {
            throw "Expected pnpm $env:PNPM_VERSION, got $installedVersion."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pnpmDirectory -Encoding utf8
          $storePath = & $pnpmCommand --dir desktop/frontend store path --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "store=$storePath" -Encoding utf8

      - name: Restore frontend dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ env.PNPM_VERSION }}-${{ hashFiles('desktop/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ env.PNPM_VERSION }}-

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}"
          choco install nsis --yes --no-progress

          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsisDirectory 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "NSIS compiler was not found at $makensis."
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "makensis version check failed with exit code $LASTEXITCODE."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nsisDirectory -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MAKENSIS=$makensis" -Encoding utf8

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir desktop/frontend install --frozen-lockfile

      - name: Generate Wails frontend bindings
        working-directory: desktop
        shell: pwsh
        run: wails3 generate bindings -clean=true -ts -i

      - name: Run frontend tests
        shell: pwsh
        run: pnpm --dir desktop/frontend test

      - name: Build frontend assets for Go validation
        shell: pwsh
        run: pnpm --dir desktop/frontend build

      - name: Validate Go modules
        shell: pwsh
        run: |
          go -C engine mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C desktop mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C engine test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C desktop test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C engine vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C desktop vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $goFiles = @(
            git ls-files -- '*.go' |
              Where-Object { $_ -like 'engine/*' -or $_ -like 'desktop/*' }
          )
          if ($goFiles.Count -eq 0) {
            throw "No tracked Go source files were found."
          }

          $unformatted = @(gofmt -l @goFiles)
          if ($LASTEXITCODE -ne 0) {
            throw "gofmt failed with exit code $LASTEXITCODE."
          }
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "Not gofmt-formatted: $_" }
            exit 1
          }

      - name: Build and package Wails desktop
        working-directory: desktop
        shell: pwsh
        run: wails3 task windows:package

      - name: Stage unsigned executables for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input | Out-Null
          Copy-Item desktop\bin\hypomux.exe signing-input\hypomux-unsigned.exe -Force
          Copy-Item desktop\bin\hypomux-engine.exe signing-input\hypomux-engine-unsigned.exe -Force

      - name: Upload desktop executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-desktop
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/hypomux-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign desktop executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-desktop.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-desktop
          skip-decompress: true

      - name: Upload Core executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-core
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/hypomux-engine-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign Core executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-core
          skip-decompress: true

      - name: Repackage signed executables
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: |
          Copy-Item signed-desktop\hypomux-unsigned.exe desktop\bin\hypomux.exe -Force
          Copy-Item signed-core\hypomux-engine-unsigned.exe desktop\bin\hypomux-engine.exe -Force
          Push-Location desktop\build\windows\nsis
          & $env:MAKENSIS "-DARG_WAILS_AMD64_BINARY=..\..\..\bin\hypomux.exe" project.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "Signed installer repackaging failed with exit code $LASTEXITCODE."
          }
          Pop-Location

      - name: Stage unsigned installer for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: Copy-Item "${{ env.INSTALLER_PATH }}" signing-input\HypoMux-amd64-installer-unsigned.exe -Force

      - name: Upload installer for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/HypoMux-amd64-installer-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Use signed installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: Copy-Item signed-installer\HypoMux-amd64-installer-unsigned.exe "${{ env.INSTALLER_PATH }}" -Force

      - name: Verify production installer trust policy
        if: github.event_name == 'workflow_dispatch' && (inputs.signing_mode == 'production' || inputs.signing_mode == 'publish')
        shell: pwsh
        run: |
          $env:HYPOMUX_SIGNED_INSTALLER_TEST = (Resolve-Path "${{ env.INSTALLER_PATH }}").Path
          go -C desktop test ./internal/services -run TestVerifyDownloadedInstallerAuthenticityAcceptsOfficialSignedInstaller -count=1 -v

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Resolve every path against the repository root captured at start-up: .NET APIs
          # such as [System.IO.File] use the process working directory, which is not
          # guaranteed to follow PowerShell's current location.
          $repoRoot = (Get-Location).Path
          Write-Host "Repository root: $repoRoot"

          $versionFile = Join-Path $repoRoot 'desktop\VERSION'
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "desktop\VERSION not found under $repoRoot; run this step from the repository root."
          }
          $version = [System.IO.File]::ReadAllText($versionFile).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'desktop\VERSION is empty; cannot derive the portable package version.'
          }

          # Sources: build output (desktop\bin) plus the tracked runtime binaries (bin\) and
          # the tracked launcher assets (desktop\portable). Fail fast with an exact path if
          # anything the package needs is missing.
          $binarySources = @(
            (Join-Path $repoRoot 'desktop\bin\hypomux.exe'),
            (Join-Path $repoRoot 'desktop\bin\hypomux-engine.exe'),
            (Join-Path $repoRoot 'bin\sing-box.exe'),
            (Join-Path $repoRoot 'bin\wintun.dll'),
            (Join-Path $repoRoot 'bin\libcronet.dll')
          )
          $assets = @(
            @{ Source = (Join-Path $repoRoot 'desktop\portable\launch-portable.cmd');     Name = '启动便携版.cmd' },
            @{ Source = (Join-Path $repoRoot 'desktop\portable\restore-environment.cmd'); Name = '恢复环境.cmd' },
            @{ Source = (Join-Path $repoRoot 'desktop\portable\PORTABLE-README.txt');     Name = '便携版说明.txt' }
          )
          foreach ($source in @($binarySources) + @($assets | ForEach-Object { $_.Source })) {
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Portable package source is missing: $source"
            }
          }

          $stageName = "HypoMux-Portable-$version-vnic-preview"
          $outDir = Join-Path $repoRoot 'portable-package'
          $stage = Join-Path $outDir $stageName
          $binDir = Join-Path $stage 'bin'
          $zipPath = Join-Path $outDir "$stageName.zip"

          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          # The layout below is fixed by the application code: keep the engine and its
          # sidecar DLLs inside bin\. desktop\internal\engineclient\service_windows.go:73-91
          # (allowAutomaticCoreFallbackPath) uses os.SameFile to require the fallback engine
          # to be exactly <dir(hypomux.exe)>\bin\hypomux-engine.exe, so flattening bin\ makes
          # the elevated Core fallback fail whenever the HypoMuxCore service is stopped.
          # sing-box.exe/wintun.dll/libcronet.dll must stay next to hypomux-engine.exe
          # because the engine resolves sing-box from its own directory and sing-box loads
          # wintun.dll from there.
          Copy-Item -LiteralPath $binarySources[0] -Destination (Join-Path $stage 'hypomux.exe') -Force
          foreach ($binary in @($binarySources[1..4])) {
            Copy-Item -LiteralPath $binary -Destination $binDir -Force
          }

          # The user-facing launch assets are stored with ASCII names in the repository and
          # only get their Chinese package names here.
          foreach ($asset in $assets) {
            Copy-Item -LiteralPath $asset.Source -Destination (Join-Path $stage $asset.Name) -Force
          }

          $required = @(
            'hypomux.exe',
            'bin\hypomux-engine.exe',
            'bin\sing-box.exe',
            'bin\wintun.dll',
            'bin\libcronet.dll',
            '启动便携版.cmd',
            '恢复环境.cmd',
            '便携版说明.txt'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $stage $_)) })
          if ($missing.Count -gt 0) {
            throw "Portable package is incomplete, missing: $($missing -join ', ')."
          }

          # SHA256SUMS.txt covers every staged file. It is written as UTF-8 without BOM so
          # the checksums stay parsable by both Windows and Linux tooling.
          $stageRoot = (Resolve-Path -LiteralPath $stage).Path
          $sumsPath = Join-Path $stage 'SHA256SUMS.txt'
          $sumLines = Get-ChildItem -LiteralPath $stage -Recurse -File |
            Where-Object { $_.FullName -ne $sumsPath } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($stageRoot.Length).TrimStart('\') -replace '\\', '/'
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          [System.IO.File]::WriteAllText($sumsPath, (($sumLines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Zip with System.IO.Compression, never Compress-Archive: Compress-Archive has a
          # history of mangling non-ASCII entry names, while .NET writes non-ASCII names as
          # UTF-8 and sets the language-encoding flag. Entries are added one by one instead
          # of with ZipFile::CreateFromDirectory because that helper stores the Windows path
          # separator, and a backslash in an entry name violates the ZIP spec (APPNOTE 4.4.17
          # requires forward slashes): tools that treat "\" as a literal file name character
          # (bsdtar, Info-ZIP) would flatten bin\ into the package root and break the
          # launcher. The package layout is part of the contract, so the separators are
          # normalized here and verified below.
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName) {
              $entryName = $file.FullName.Substring($stageRoot.Length).TrimStart('\') -replace '\\', '/'
              $entry = $archive.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              try {
                $fileStream = [System.IO.File]::OpenRead($file.FullName)
                try { $fileStream.CopyTo($entryStream) } finally { $fileStream.Dispose() }
              } finally {
                $entryStream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
          }

          $zipCheck = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $badEntries = @($zipCheck.Entries | Where-Object { $_.FullName -like '*\*' })
            if ($badEntries.Count -gt 0) {
              throw "Zip entry names must use forward slashes, found: $($badEntries[0].FullName)"
            }
            if ($zipCheck.Entries.Count -ne $required.Count + 1) {
              throw "Unexpected zip entry count: $($zipCheck.Entries.Count) (expected $($required.Count + 1))."
            }
          } finally {
            $zipCheck.Dispose()
          }

          $stageBytes = (Get-ChildItem -LiteralPath $stage -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Portable package stage: $stageRoot ($stageBytes bytes)"
          Write-Host "Portable package zip  : $zipPath ($((Get-Item -LiteralPath $zipPath).Length) bytes)"
          Write-Host 'Staged files:'
          Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            Write-Host ("  {0,12}  {1}" -f $_.Length, $_.FullName.Substring($stageRoot.Length).TrimStart('\'))
          }
          Write-Host 'Zip entries:'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $zip.Entries | Sort-Object FullName | ForEach-Object {
              Write-Host ("  {0,12}  {1}" -f $_.Length, $_.FullName)
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: HypoMux-Portable-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            portable-package/*.zip
            portable-package/*/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HypoMux-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            desktop/bin/hypomux.exe
            desktop/bin/hypomux-engine.exe
            ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

  release:
    name: Publish release installer
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'publish' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: hypomux-release-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: HypoMux-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts

      # There is no in-app auto-update in this fork, so nothing publishes a
      # latest.json manifest or a signed update channel. This step only resolves
      # the prerelease / make-latest classification used by both Release mirrors.
      - name: Resolve release version metadata
        id: version
        shell: bash
        run: go -C desktop run ./cmd/release-version -tag "${GITHUB_REF_NAME}" -notes -github-output "${GITHUB_OUTPUT}"

      - name: Validate versioned release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          release_notes_path=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${release_notes_path}" ]]; then
            echo "Missing release notes for ${GITHUB_REF_NAME}: ${release_notes_path}"
            exit 1
          fi
          if [[ ! -s "${release_notes_path}" ]]; then
            echo "Release notes are empty: ${release_notes_path}"
            exit 1
          fi
          printf 'path=%s\n' "${release_notes_path}" >> "${GITHUB_OUTPUT}"

      # The single signed installer is staged once under a versioned, human-readable
      # name so both Release mirrors publish byte-identical assets that users can
      # pick out on the download page. This is not an update-channel artifact.
      - name: Stage versioned release installer name
        id: stage_release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp artifacts/hypomux-amd64-installer.exe "artifacts/HypoMux_Setup_${version}.exe"
          echo "installer_name=HypoMux_Setup_${version}.exe" >> "${GITHUB_OUTPUT}"

      - name: Preflight synchronized GitHub and CNB tags
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected_commit="$(git rev-parse HEAD^{commit})"
          resolve_remote_tag_commit() {
            local repository="$1"
            local refs
            local direct
            local peeled
            refs="$(git ls-remote "${repository}" "refs/tags/${tag}" "refs/tags/${tag}^{}" || true)"
            direct="$(awk -v ref="refs/tags/${tag}" '$2 == ref {print $1; exit}' <<<"${refs}")"
            peeled="$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref {print $1; exit}' <<<"${refs}")"
            if [[ -n "${peeled}" ]]; then printf '%s' "${peeled}"; else printf '%s' "${direct}"; fi
          }
          github_commit="$(resolve_remote_tag_commit origin)"
          cnb_commit="$(resolve_remote_tag_commit https://cnb.cool/Hypostasis-Cat/HypoMux)"
          if [[ -z "${github_commit}" || -z "${cnb_commit}" ||
                "${github_commit}" != "${cnb_commit}" ||
                "${github_commit}" != "${expected_commit}" ]]; then
            echo "Release tag preflight failed: expected=${expected_commit} GitHub=${github_commit:-missing} CNB=${cnb_commit:-missing}."
            exit 1
          fi
          echo "Release tag ${tag} is synchronized at ${expected_commit}."

      - name: Ensure CNB Release and upload installer
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_IMAGE: docker.cnb.cool/looc/git-cnb@sha256:c254172bb9d6025733a0e2991b4a99af8c46aeedcadcb468788ef5a0dc00275c
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          release_notes_path="${{ steps.release_notes.outputs.path }}"
          release_body="$(cat "${release_notes_path}"; printf '\036')"
          release_body="${release_body%$'\036'}"
          cnb() {
            docker run --rm -e CNB_TOKEN "${CNB_IMAGE}" \
              git-cnb --repo=Hypostasis-Cat/HypoMux "$@"
          }

          if ! cnb release get -t "${tag}" >/dev/null 2>&1; then
            cnb release create -t "${tag}" -n "HypoMux ${version}" \
              --body "${release_body}" --make-latest "${{ steps.version.outputs.make_latest }}" \
              --prerelease=${{ steps.version.outputs.prerelease }}
          fi
          cnb release get -t "${tag}" >/dev/null
          cnb --json release get -t "${tag}" | jq -e \
            --argjson expected '${{ steps.version.outputs.prerelease }}' \
            '(.prerelease // false) == $expected' >/dev/null
          cnb --json release get -t "${tag}" | jq -j '.body' > artifacts/cnb-release-notes.md
          if ! cmp --silent "${release_notes_path}" artifacts/cnb-release-notes.md; then
            echo "CNB Release body differs from ${release_notes_path}."
            exit 1
          fi

          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          asset_url="https://cnb.cool/Hypostasis-Cat/HypoMux/-/releases/download/${tag}/$(basename "${installer}")"
          existing="artifacts/cnb-existing-installer.exe"
          status="$(curl --silent --show-error --location --output "${existing}" --write-out '%{http_code}' "${asset_url}" || true)"
          case "${status}" in
            200)
              if ! cmp --silent "${installer}" "${existing}"; then
                echo "CNB Release already contains a different installer with the same name."
                exit 1
              fi
              echo "CNB installer already exists and is byte-identical; skipping upload."
              ;;
            404)
              docker run --rm -e CNB_TOKEN \
                -v "${PWD}:/workspace:ro" -w /workspace "${CNB_IMAGE}" \
                git-cnb --repo=Hypostasis-Cat/HypoMux \
                  release asset-upload -t "${tag}" -f "${installer}"
              ;;
            *)
              echo "Unable to inspect the CNB installer before upload (HTTP ${status:-unknown})."
              exit 1
              ;;
          esac

      - name: Check existing GitHub installer
        id: github_installer
        shell: bash
        run: |
          set -euo pipefail
          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          asset_url="https://github.com/Hypostasis-Cat/HypoMux/releases/download/${GITHUB_REF_NAME}/$(basename "${installer}")"
          existing="artifacts/github-existing-installer.exe"
          status="$(curl --silent --show-error --location --output "${existing}" --write-out '%{http_code}' "${asset_url}" || true)"
          case "${status}" in
            200)
              if ! cmp --silent "${installer}" "${existing}"; then
                echo "GitHub Release already contains a different installer with the same name."
                exit 1
              fi
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unable to inspect the GitHub installer before upload (HTTP ${status:-unknown})."
              exit 1
              ;;
          esac

      - name: Create or update GitHub Release metadata
        if: steps.github_installer.outputs.upload == 'false'
        uses: softprops/action-gh-release@v3
        with:
          name: HypoMux ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to GitHub Release
        if: steps.github_installer.outputs.upload == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: HypoMux ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          files: artifacts/${{ steps.stage_release.outputs.installer_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both Release installers are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          filename="$(basename "${installer}")"
          verify_download() {
            local label="$1"
            local url="$2"
            local destination="$3"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --output "${destination}" "${url}" &&
                 cmp --silent "${installer}" "${destination}"; then
                echo "${label} installer matches the signed build."
                return 0
              fi
              rm -f "${destination}"
              sleep 5
            done
            echo "${label} installer did not become available or was not byte-identical."
            return 1
          }
          verify_download GitHub \
            "https://github.com/Hypostasis-Cat/HypoMux/releases/download/${GITHUB_REF_NAME}/${filename}" \
            artifacts/verify-github-installer.exe
          verify_download CNB \
            "https://cnb.cool/Hypostasis-Cat/HypoMux/-/releases/download/${GITHUB_REF_NAME}/${filename}" \
            artifacts/verify-cnb-installer.exe
          sha256sum "${installer}" artifacts/verify-github-installer.exe artifacts/verify-cnb-installer.exe
